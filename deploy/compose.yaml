name: pickme
services:
  api:
    build:
      context: ../backend
      target: runtime
    image: pickme-api:local
    container_name: pickme-api
    restart: unless-stopped
    network_mode: host
    env_file: ../.env
    volumes:
      - ../data/uploads:/app/uploads
    read_only: true
    tmpfs:
      - /tmp:size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 384m
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3010/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
  migrate:
    image: pickme-migrate:local
    profiles: [tools]
    build:
      context: ../backend
      target: migrate
    network_mode: host
    env_file: ../.env
    restart: 'no'
